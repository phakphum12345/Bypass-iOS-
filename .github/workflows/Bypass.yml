name: Generate Bypass Architecture Document

on:
  workflow_dispatch:
  push:
    paths:
      - "Bypass.md"
      - "docs/**"
      - ".github/workflows/Bypass.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Bypass.md
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Bypass.md")

          if not path.exists():
              raise SystemExit("Bypass.md does not exist")

          print(f"Using existing canonical document: {path}")
          print(f"Size: {path.stat().st_size} bytes")
          PY

      - name: Validate Architecture v2
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Architecture v2 CI Gate ==="

          required_files=(
            "Bypass.md"
            "docs/API_CONTRACT.md"
            "docs/DECISION_MODEL.md"
            "docs/DATA_MODEL.md"
            "docs/THREAT_MODEL.md"
            "docs/VERIFICATION_MATRIX.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: Missing or empty file: $file"
              exit 1
            fi
            echo "PASS: $file"
          done

          echo "=== Canonical Architecture Checks ==="

          grep -q "Identity" Bypass.md
          grep -q "Capability" Bypass.md
          grep -q "Policy" Bypass.md
          grep -q "Authorization" Bypass.md
          grep -q "Entitlement" Bypass.md
          grep -q "Execution" Bypass.md
          grep -q "Evidence" Bypass.md

          echo "PASS: Canonical flow"

          echo "=== Security Boundary Checks ==="

          grep -qi "Authorization MUST be evaluated server-side" docs/API_CONTRACT.md
          grep -qi "client" docs/DECISION_MODEL.md
          grep -qi "Research Boundary" docs/THREAT_MODEL.md

          echo "PASS: Security boundary"

          echo "=== Verification Matrix ==="

          grep -q "Authentication" docs/VERIFICATION_MATRIX.md
          grep -q "Authorization" docs/VERIFICATION_MATRIX.md
          grep -q "Replay Protection" docs/VERIFICATION_MATRIX.md
          grep -q "Audit" docs/VERIFICATION_MATRIX.md

          echo "PASS: Verification matrix"

          echo "=== Architecture v2 CI Gate: PASS ==="

      - name: Check Markdown files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            Bypass.md \
            docs/API_CONTRACT.md \
            docs/DECISION_MODEL.md \
            docs/DATA_MODEL.md \
            docs/THREAT_MODEL.md \
            docs/VERIFICATION_MATRIX.md
          do
            if grep -n $'\r' "$file" >/dev/null 2>&1; then
              echo "WARNING: CRLF detected in $file"
            fi
          done

          echo "Markdown inspection complete."

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Bypass.md docs/

          if git diff --cached --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi

          git commit -m "docs: update architecture research reference"
          git push origin HEAD:main
