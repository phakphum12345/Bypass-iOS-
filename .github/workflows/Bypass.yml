name: Generate Bypass Architecture Document

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-bypass-md.yml"

permissions:
  contents: write

jobs:
  generate-bypass-md:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Bypass.md
        shell: bash
        run: |
          cat > Bypass.md <<'EOF'
# Bypass iOS — Architecture Research Reference

> Architecture research document for Device Service Platform,
> Device Intelligence, Eligibility, Authorization, Entitlement,
> Workflow, API and Security Architecture.

## Canonical Flow

```text
Identity
  ↓
Capability
  ↓
Policy
  ↓
Authorization
  ↓
Entitlement
  ↓
Execution
  ↓
Evidence
