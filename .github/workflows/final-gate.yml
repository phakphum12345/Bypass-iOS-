name: Final Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required architecture files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "Bypass.md"
            "docs/architecture/system-overview.md"
            "docs/architecture/security-boundary.md"
            "docs/architecture/decision-pipeline.md"
            "docs/architecture/evidence-model.md"
            "docs/device/identity.md"
            "docs/device/capabilities.md"
            "docs/ui/design-system.md"
            "api/README.md"
            "api/contracts/decision-request.json"
            "api/contracts/decision-response.json"
            "api/contracts/evidence.json"
            "api/schemas/decision.schema.json"
            "flutter_app/pubspec.yaml"
            "flutter_app/lib/main.dart"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

      - name: Validate security boundary
        shell: bash
        run: |
          set -euo pipefail

          for required in \
            "Identity" \
            "Capability" \
            "Policy" \
            "Authorization" \
            "Entitlement" \
            "Execution" \
            "Evidence"
          do
            grep -q "$required" Bypass.md
          done

          for prohibited in \
            "Activation Lock bypass" \
            "Passcode bypass" \
            "MDM circumvention" \
            "Credential theft" \
            "Exploit delivery" \
            "Unauthorized device access" \
            "Security-control evasion"
          do
            grep -qi "$prohibited" Bypass.md
          done

      - name: Validate Flutter external-tool boundary
        shell: bash
        run: |
          set -euo pipefail

          grep -qi "external tool" Bypass.md
          grep -qi "must not manufacture authorization" Bypass.md
          grep -qi "must not manufacture entitlement" Bypass.md
          grep -qi "server authoritative" Bypass.md

      - name: Validate API contracts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("api/contracts/decision-request.json"),
              Path("api/contracts/decision-response.json"),
              Path("api/contracts/evidence.json"),
              Path("api/schemas/decision.schema.json"),
          ]

          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"VALID JSON: {path}")

          request = json.loads(
              Path("api/contracts/decision-request.json").read_text(encoding="utf-8")
          )
          response = json.loads(
              Path("api/contracts/decision-response.json").read_text(encoding="utf-8")
          )
          evidence = json.loads(
              Path("api/contracts/evidence.json").read_text(encoding="utf-8")
          )
          schema = json.loads(
              Path("api/schemas/decision.schema.json").read_text(encoding="utf-8")
          )

          assert request["additionalProperties"] is False
          assert response["additionalProperties"] is False
          assert evidence["additionalProperties"] is False

          assert response["properties"]["decision"]["enum"] == ["ALLOWED", "DENY"]
          assert response["properties"]["authorization"]["enum"] == [
              "ALLOWED", "DENY", "UNKNOWN"
          ]
          assert response["properties"]["entitlement"]["enum"] == [
              "ACTIVE", "INACTIVE", "EXPIRED", "REVOKED", "UNKNOWN"
          ]

          assert schema["properties"]["decision"]["enum"] == ["ALLOWED", "DENY"]
          assert schema["properties"]["authorization"]["enum"] == [
              "ALLOWED", "DENY", "UNKNOWN"
          ]
          assert "ACTIVE" in schema["properties"]["entitlement"]["enum"]

          print("API CONTRACT SEMANTICS: PASS")
          PY

      - name: Validate repository whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter tests
        working-directory: flutter_app
        run: flutter test

      - name: Flutter build
        working-directory: flutter_app
        run: flutter build bundle --target lib/main.dart

      - name: Final Gate PASS
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL GATE: PASS"
          echo "Architecture: PASS"
          echo "Security Boundary: PASS"
          echo "Flutter External Tool Boundary: PASS"
          echo "API Contracts: PASS"
          echo "Repository Whitespace: PASS"
          echo "Flutter Analyze: PASS"
          echo "Flutter Tests: PASS"
          echo "Flutter Build: PASS"
