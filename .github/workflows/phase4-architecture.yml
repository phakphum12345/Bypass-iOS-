name: Phase 4 Architecture Validation

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - 'docs/architecture/**'
      - '.github/workflows/phase4-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate architecture structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "flutter_app/lib/core/contracts/decision_pipeline_contract.dart"
            "flutter_app/lib/core/contracts/decision_pipeline_result.dart"
            "flutter_app/lib/core/pipeline/decision_pipeline.dart"
            "flutter_app/lib/core/services/authorization_service.dart"
            "flutter_app/lib/core/services/entitlement_service.dart"
            "flutter_app/lib/core/services/evidence_service.dart"
            "flutter_app/lib/core/security/security_boundary.dart"
            "flutter_app/test/decision_pipeline_test.dart"
            "docs/architecture/PHASE_4_CONTRACT.md"
            "docs/architecture/DECISION_PIPELINE.md"
            "docs/architecture/EVIDENCE_AUDIT.md"
            "docs/architecture/SECURITY_BOUNDARIES.md"
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
            echo "PASS: $file"
          done

      - name: Validate security boundary
        shell: bash
        run: |
          set -euo pipefail

          grep -q "canClientOverrideAuthorization"             flutter_app/lib/core/security/security_boundary.dart

          grep -q "return false"             flutter_app/lib/core/security/security_boundary.dart

          grep -qi "server authorization"             docs/architecture/PHASE_4_CONTRACT.md

          echo "PASS: security boundary"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter test
        working-directory: flutter_app
        run: flutter test

      - name: Dart format check
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Final Phase 4 gate
        run: |
          echo "========================================"
          echo "PHASE 4 ARCHITECTURE VALIDATION: PASS"
          echo "Structure       : PASS"
          echo "Security        : PASS"
          echo "Flutter analyze : PASS"
          echo "Flutter tests   : PASS"
          echo "Dart format     : PASS"
          echo "Mutation        : DISABLED"
          echo "Git push        : DISABLED"
          echo "========================================"
